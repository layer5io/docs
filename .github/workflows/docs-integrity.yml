name: Docs Integrity

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: docs-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  docs-integrity:
    name: docs-integrity
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: 0.158.0
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Term guard
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: .github/scripts/term-guard.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Production build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: npm run build:production -- --destination public

      - name: Internal link check (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress --root-dir "${{ github.workspace }}/public"
            "public/**/*.html"
          fail: true

      - name: Redirect check
        run: python3 .github/scripts/check-redirects.py PATHMAP.csv public
