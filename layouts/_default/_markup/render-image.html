<!-- Images that use the standard image format for markdown will be displayed in
  an accessible modal popup. Use format ![alt text](/path/to/image.img) -->
<!-- The image is wrapped in a native button so it can be opened with Enter or Space. -->

<div class="md__image">
  <button
    type="button"
    class="md__image-trigger"
    aria-label="Expand image"
  >
    <img
      src="{{ .Destination | safeURL }}"
      alt="{{ .Text }}"
      class="md-image-responsive{{ with .Title }} {{ . }}{{ end }}"
    />
  </button>
</div>
