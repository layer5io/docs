{{- $target := .Site.GetPage .Params.moved_to -}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ $target.Title }}</title>
  <link rel="canonical" href="{{ $target.Permalink }}">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url={{ $target.Permalink }}">
</head>
<body>
  <p>This page moved to <a href="{{ $target.Permalink }}">{{ $target.Title }}</a>.</p>
</body>
</html>
